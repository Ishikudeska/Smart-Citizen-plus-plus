# Builds the installer and the portable zip with packaging/package.ps1.
# Runs on a version tag (v1.2.3), which also publishes a GitHub release, on
# pull requests, or by hand from the Actions tab (artifacts only).
#
# Qt is installed to C:\Qt so the paths in CMakePresets.json hold.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A new push to a pull request supersedes its earlier package build; tag builds
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          host: windows
          target: desktop
          arch: win64_mingw
          dir: C:\
          tools: "tools_mingw1310 tools_ninja tools_cmake"
          cache: true
          # aqtinstall 3.3.0 (latest on PyPI) predates the per-compiler repo layout
          # Qt uses from 6.11, so use a master commit with that support until 3.4.0.
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $identity = Get-Content cmake/AppIdentity.cmake -Raw
          if ($identity -notmatch 'set\(APP_VERSION\s+"([^"]+)"\)') { throw "APP_VERSION not found" }
          if ("v$($Matches[1])" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match APP_VERSION $($Matches[1])"
          }

      # The release presets build only the app (no tests or tools).
      - name: Build and package
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\Tools\mingw1310_64\bin;C:\Qt\6.12.0\mingw_64\bin;C:\Qt\Tools\Ninja;C:\Qt\Tools\CMake_64\bin;$env:PATH"
          ./packaging/package.ps1

      # One artifact per package, each required: package.ps1 only warns when it
      # cannot find Inno Setup, and the in-app updater needs the Setup.exe.
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*-Setup.exe
          if-no-files-found: error

      - name: Upload the portable zip
        uses: actions/upload-artifact@v7
        with:
          name: portable
          path: dist/*-Portable-*.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*-Setup.exe
            dist/*-Portable-*.zip
