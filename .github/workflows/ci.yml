name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Installs into C:\Qt so the paths in CMakePresets.json match.
      - name: Install Qt 6.12 + MinGW 13.1 + Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: 'C:\'
          tools: 'tools_mingw1310 tools_ninja'
          cache: true
          # aqtinstall 3.3.0 (latest on PyPI) predates the per-compiler repo layout
          # Qt uses from 6.11, so use a master commit with that support until 3.4.0.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: Configure
        run: cmake --preset mingw-debug

      - name: Build
        run: cmake --build --preset mingw-debug

      - name: Test
        run: ctest --preset mingw-debug -LE parity
