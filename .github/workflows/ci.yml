name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Installs into C:\Qt so the paths in CMakePresets.json match.
      - name: Install Qt 6.12 + MinGW 13.1 + Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: 'C:\'
          tools: 'tools_mingw1310 tools_ninja'
          cache: true

      - name: Configure
        run: cmake --preset mingw-release

      - name: Build
        run: cmake --build --preset mingw-release

      - name: Test
        run: ctest --preset mingw-release -LE parity
